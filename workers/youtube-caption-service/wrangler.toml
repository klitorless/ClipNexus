# Deploy with Wrangler: clipnexus-youtube-caption-test
#
# This replaces the existing `clipnexus-youtube-caption-test` Worker at
# https://clipnexus-youtube-caption-test.klitorless.workers.dev/youtube-transcript
# — the exact URL the ClipNexus youtube-native provider is configured for.
# Deploying under the same name keeps the client working with no changes.

name = "clipnexus-youtube-caption-test"
main = "src/index.js"
compatibility_date = "2026-10-01"

# No R2, D1, or secrets: the Worker is stateless apart from
# the caption-job queue state below. It only fetches
# YouTube's caption endpoints.

# --- Caption request queue (Cloudflare Queues + KV) ---
#
# MANUAL SETUP (Cloudflare dashboard), all on the Free tier:
#   1. Workers & Pages -> Queues -> Create queue:
#      name "clipnexus-caption-jobs"
#   2. Workers & Pages -> Queues -> Create queue:
#      name "clipnexus-caption-jobs-dlq" (dead-letter queue)
#   3. Workers & Pages -> KV -> Create namespace:
#      name "clipnexus-caption-jobs"
#   4. Copy the KV namespace ID into the `id` field below
#      (replacing REPLACE_WITH_KV_NAMESPACE_ID).
#   5. Redeploy this Worker. The Queues dashboard then shows
#      backlog, consumer lag, and DLQ depth.
#
# Until steps 1-5 are done, POST /caption-jobs answers 501 and
# the ClipNexus client falls back to the synchronous endpoint.

[[queues.producers]]
queue = "clipnexus-caption-jobs"
binding = "CAPTION_QUEUE"

[[queues.consumers]]
queue = "clipnexus-caption-jobs"
max_batch_size = 5
max_batch_timeout = 30
# 10: slot-wait redeliveries (one per 10-minute user slot) must
# not exhaust the delivery budget before genuine processing
# retries. Slot waits never count against the app's
# MAX_ATTEMPTS — attempts only start when processing starts.
max_retries = 10
dead_letter_queue = "clipnexus-caption-jobs-dlq"

[[kv_namespaces]]
binding = "JOB_STORE"
id = "95e76412e160465198123db1b7d39129"
