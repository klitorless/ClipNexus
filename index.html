<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <!-- Security (Stage 2B; Stage 10): the only allowed external
         connections are the transcript provider API and the
         privacy-enhanced YouTube embed used by the Clip Queue
         player. No third-party scripts, styles, or other frames. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.supadata.ai https://www.googleapis.com https://clipnexus-youtube-caption-test.klitorless.workers.dev; frame-src https://www.youtube-nocookie.com; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>ClipNexus</title>

    <!-- Styles: base tokens, page layout, reusable components -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
</head>
<body>
    <div class="app-shell">

        <!-- Sticky top cluster on mobile (header + nav strip); the
             wrapper dissolves on desktop via display: contents. -->
        <div class="app-top">
            <!-- Top bar: brand (mobile) + upload control -->
            <header class="app-header">
                <div class="brand brand-in-header">
                    <svg class="brand-mark" viewBox="0 0 24 24" width="26" height="26"
                         aria-label="ClipNexus logo" role="img">
                        <path d="M6 4.5v15l13-7.5z" fill="currentColor"></path>
                    </svg>
                    <span class="brand-name">ClipNexus</span>
                </div>

                <button id="upload-button" class="button button-primary" type="button">
                    Upload Transcript
                </button>

                <!-- Hidden file input, opened by the Upload button (see js/app.js).
                     Its "accept" list is set from js/transcript/formats.js. -->
                <input id="transcript-file-input" class="visually-hidden" type="file"
                       tabindex="-1" aria-hidden="true">
            </header>

            <!-- Sidebar navigation mount point (rendered by js/ui/sidebar.js) -->
            <nav id="sidebar-mount" class="app-sidebar" aria-label="Sections"></nav>
        </div>

        <!-- Main content area -->
        <main class="app-main">
            <!-- Load check: removed by js/app.js once modules run.
                 If you can read this, css/ or js/ did not load. -->
            <div id="load-check" class="load-check" role="alert">
                <p><strong>App files did not load.</strong></p>
                <p>The css/ and js/ folders must sit next to index.html,
                   and the page must be opened through a local server
                   (http://...), not as a single file (file:// or content://).</p>
            </div>

            <h1 id="page-title" class="page-title">Dashboard</h1>
            <section id="content-mount" class="content" aria-live="polite"></section>
        </main>

    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
